[project]
name = "research-orchestrator"
version = "0.1.0"
description = "Modular content scraper / deep research orchestrator with Supabase storage"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "supabase>=2.9",
    "trafilatura>=1.12",
    "feedparser>=6.0",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "praw>=7.7",
]

[project.scripts]
research-orchestrator = "research_orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
