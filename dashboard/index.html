<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Command Center · Research Orchestrator</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --panel-2: #182230;
    --line: #233040;
    --text: #e7eef6;
    --muted: #8aa0b4;
    --accent: #4cc3ff;
    --good: #46d39a;
    --warn: #f3b94d;
    --bad: #ff6b6b;
    --chip: #1d2a38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 20px 28px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
  header .meta { color: var(--muted); font-size: 13px; }
  main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 28px 0 12px; }
  .grid { display: grid; gap: 14px; }
  .stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  }
  .stat .n { font-size: 30px; font-weight: 650; }
  .stat .l { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .tile { display: flex; flex-direction: column; gap: 10px; }
  .tile .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tile h3 { margin: 0; font-size: 16px; }
  .tile .cat { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .tile .one { font-size: 14px; }
  .tile .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--chip); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 3px 10px; font-size: 12px;
  }
  .badge { border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.researched { background: rgba(76,195,255,.12); color: var(--accent); border: 1px solid rgba(76,195,255,.35); }
  .badge.parked { background: rgba(243,185,77,.12); color: var(--warn); border: 1px solid rgba(243,185,77,.35); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
  .kv .k { color: var(--muted); }
  details { border-top: 1px solid var(--line); padding-top: 8px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  details ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
  a { color: var(--accent); }
  .err { color: var(--bad); font-size: 13px; }
  .recent { font-size: 13px; }
  .recent div { padding: 6px 0; border-top: 1px solid var(--line); color: var(--muted); }
  .recent div:first-child { border-top: 0; }
  .cfg { display: flex; gap: 8px; align-items: center; }
  .cfg input {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 5px 9px; font-size: 12.5px; width: 240px;
  }
  .cfg button {
    background: var(--accent); border: 0; color: #04121c; font-weight: 600;
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12.5px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Command Center</h1>
    <div class="meta">Research Orchestrator · live overview</div>
  </div>
  <div class="cfg">
    <input id="api" placeholder="http://localhost:8000" />
    <button id="reload">Refresh</button>
  </div>
</header>

<main>
  <h2>Pipeline</h2>
  <div id="stats" class="grid stats">
    <div class="card stat"><div class="n">—</div><div class="l">loading…</div></div>
  </div>
  <div id="statsErr" class="err"></div>

  <h2>Recent documents</h2>
  <div id="recent" class="card recent"><div>loading…</div></div>

  <h2>Opportunities &amp; parked ideas</h2>
  <div id="tiles" class="grid tiles"></div>
</main>

<script>
// ---- Parked-idea tiles. Add new opportunities by appending to this array. ----
const TILES = [
  {
    "title": "Vibe-Coding Talent Marketplace",
    "category": "Business idea — parked for future consideration",
    "council_score": "2.5/5 as a plain job board · ~4/5 if pivoted to vetting-led",
    "status": "Researched",
    "one_liner": "Hire AI-native builders whose work is already shipped & stress-tested — proof-of-work, not résumés.",
    "verdict": "Wave is real (Cursor ~$2B ARR, Lovable $200M ARR, ~90% dev AI adoption); the job-board format is weak — already cloned (GoodVibeCode, VibeCodeCareers), no moat, two-sided cold-start, and the term itself is fading (Karpathy called 'vibe coding' passe, Feb 2026).",
    "killer_value_prop": "Trust/verification layer + escrow, wedged into non-technical founders needing an MVP.",
    "recommended_wedge": "Start single-sided: (1) security/QA audits for vibe-coded apps (58% had a critical vuln in one scan) -> (2) newsletter/community as audience -> (3) vetting-led marketplace last, into an owned audience.",
    "top_risks": ["Two-sided cold-start", "Zero defensibility vs LinkedIn/Upwork", "Buzzword decay 12-24mo", "Skill hard to screen"],
    "next_step": "Validate willingness-to-pay for the audit service before building any marketplace.",
    "full_memo": "docs/opportunities/vibe-coding-marketplace.md"
  }
];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function apiBase() {
  return (localStorage.getItem('cc_api') || $('#api').value || 'http://localhost:8000').replace(/\/$/, '');
}

function renderTiles() {
  $('#tiles').innerHTML = TILES.map(t => {
    const badgeClass = (t.status || '').toLowerCase().includes('park') ? 'parked' : 'researched';
    const risks = (t.top_risks || []).map(r => `<span class="chip">${esc(r)}</span>`).join('');
    return `
    <div class="card tile">
      <div class="top">
        <div>
          <h3>${esc(t.title)}</h3>
          <div class="cat">${esc(t.category || '')}</div>
        </div>
        <span class="badge ${badgeClass}">${esc(t.status || '')}</span>
      </div>
      <div class="one">${esc(t.one_liner || '')}</div>
      <div class="kv">
        ${t.council_score ? `<span class="k">Council</span><span>${esc(t.council_score)}</span>` : ''}
        ${t.next_step ? `<span class="k">Next step</span><span>${esc(t.next_step)}</span>` : ''}
      </div>
      ${risks ? `<div class="row">${risks}</div>` : ''}
      <details>
        <summary>Details</summary>
        <ul>
          ${t.verdict ? `<li><b>Verdict:</b> ${esc(t.verdict)}</li>` : ''}
          ${t.killer_value_prop ? `<li><b>Value prop:</b> ${esc(t.killer_value_prop)}</li>` : ''}
          ${t.recommended_wedge ? `<li><b>Wedge:</b> ${esc(t.recommended_wedge)}</li>` : ''}
          ${t.full_memo ? `<li><a href="${esc(t.full_memo)}">Full memo</a></li>` : ''}
        </ul>
      </details>
    </div>`;
  }).join('');
}

async function loadStats() {
  $('#statsErr').textContent = '';
  try {
    const r = await fetch(apiBase() + '/stats');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const cards = [
      ['Entities', d.entities], ['Documents', d.documents], ['Notes', d.notes],
    ];
    if (d.last_run) cards.push(['Last run', d.last_run.status || '—']);
    $('#stats').innerHTML = cards.map(([l, n]) =>
      `<div class="card stat"><div class="n">${esc(n ?? '—')}</div><div class="l">${esc(l)}</div></div>`
    ).join('');
    const recent = (d.recent_documents || []);
    $('#recent').innerHTML = recent.length
      ? recent.map(x => `<div>${esc(x.title || x.url || '(untitled)')}</div>`).join('')
      : '<div>No documents yet.</div>';
  } catch (e) {
    $('#stats').innerHTML = '<div class="card stat"><div class="n">—</div><div class="l">offline</div></div>';
    $('#recent').innerHTML = '<div>—</div>';
    $('#statsErr').textContent = 'Could not reach ' + apiBase() + '/stats (' + e.message + '). Start the API or set the URL above.';
  }
}

$('#api').value = localStorage.getItem('cc_api') || 'http://localhost:8000';
$('#reload').addEventListener('click', () => {
  localStorage.setItem('cc_api', $('#api').value.replace(/\/$/, ''));
  loadStats();
});

renderTiles();
loadStats();
</script>
</body>
</html>
